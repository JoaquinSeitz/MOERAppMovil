<!DOCTYPE html>
<html lang="es">
<head>
    <style>
        html {
            font-size: 12px !important;
        }

        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #FDFBF7; /* Marfil MOER */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .spinner {
            border: 5px solid rgba(227, 168, 139, 0.2);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border-left-color: #E0926C; /* Naranja/Durazno MOER */
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            color: #3E3E3E;
            font-size: 18px;
            font-weight: 500;
        }
    </style>
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MOER Estética</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="app.css" />
    <!-- Referencia ajustada al nuevo namespace -->
    <link rel="stylesheet" href="MOERAppMovil.styles.css" />
    <link rel="icon" href="data:,">
</head>
<body>
    <div class="status-bar-safe-area"></div>

    <div id="app">
        <div class="loading-container">
            <div class="spinner"></div>
            <div class="loading-text">Cargando MOER Estética...</div>
        </div>
    </div>

    <div id="blazor-error-ui" data-nosnippet>
        Ha ocurrido un error no controlado.
        <a href="." class="reload">Recargar</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
</body>
</html>
